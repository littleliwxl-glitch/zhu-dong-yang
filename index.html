<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07091a">
<title>进来看看</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f7f2ff;
    --muted: rgba(247, 242, 255, .76);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
    --round: "YouYuan", "Yuanti SC", "PingFang SC", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background: #07091a;
  }
  button, input { font-family: inherit; }
  [hidden] { display: none !important; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #pets { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .pet { position: fixed; z-index: 1; pointer-events: none; }
  .bob, .ears { width: 100%; height: 100%; }
  .bob { transform-origin: 50% 88%; }
  .ears { transform-origin: 50% 64%; animation: kittenLook 9.6s ease-in-out infinite; }
  #pet-him .ears { animation-name: kittenLookHim; animation-duration: 11.4s; animation-delay: -5s; }
  .pet img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    transform-origin: 50% 88%;
    animation: kittenBreathe 2.8s ease-in-out infinite;
  }
  #pet-him img { animation-duration: 3.4s; animation-delay: -1.3s; }
  .pet.roam:not(.pause-step) .ears,
  .pet.throwing .ears, .pet.catch-react .ears, .pet.nod .ears,
  .pet.singing .ears, .pet.blowing .ears { animation-play-state: paused; }
  .pet.roam:not(.pause-step) img, .pet.throwing img, .pet.catch-react img, .pet.nod img,
  .pet.singing img, .pet.blowing img { animation-play-state: paused; }
  .note {
    position: absolute; right: 8%; top: 6%; opacity: 0; color: #ffe7a3;
    font-size: 20px; text-shadow: 0 0 8px #ffe7a3;
  }
  .pet.singing .note { opacity: 1; animation: notes 1.5s ease-in-out infinite; }
  .pet.singing .note::after {
    content: "♫"; position: absolute; left: -16px; top: 8px;
    animation: notes 1.6s ease-in-out infinite; animation-delay: .55s;
  }
  .pet.roam .bob { animation: kittenTrot .72s ease-in-out infinite; }
  .pet.roam.pause-step .bob { animation: kittenSit .7s ease-out; }
  .pet.throwing .bob { animation: toss .64s cubic-bezier(.2,.8,.2,1); }
  .pet.catch-react .bob { animation: hop .6s cubic-bezier(.2,.7,.2,1); }
  .pet.nod .bob { transform-origin: 50% 62%; animation: nod .9s ease-in-out; }
  .pet.blowing .bob { transform-origin: 50% 72%; animation: puff .9s ease-in-out infinite; }
  .pet.singing .bob { animation: sway 2.2s ease-in-out infinite; }
  #stage { position: relative; z-index: 2; height: 100vh; height: 100dvh; }
  #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .scene {
    position: absolute; inset: 0; z-index: 1;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(14px);
    transition: opacity .28s var(--ease-in), transform .28s var(--ease-in), visibility .28s;
  }
  .scene.active {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: none;
    transition: opacity .36s var(--ease-out), transform .36s var(--ease-out), visibility 0s;
  }
  .scene-inner {
    height: 100%; overflow: auto; padding: 58px 16px 132px;
    display: flex; flex-direction: column; align-items: center;
  }
  .center-scene { justify-content: center; text-align: center; }
  h1, h2, p { margin: 0; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.65; text-align: center; max-width: 26em; }
  .fine { color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; max-width: 22em; margin-top: 8px; }
  .card {
    width: min(440px, 100%);
    background: rgba(10, 12, 32, .55);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    padding: 22px 18px 18px;
    backdrop-filter: blur(10px);
    text-align: center;
  }
  .mark { width: 54px; height: 54px; margin: 0 auto 6px; filter: drop-shadow(0 0 10px rgba(255, 214, 140, .85)); }
  .mark svg { width: 100%; height: 100%; }
  label { display: block; text-align: left; margin: 12px 0 6px; font-size: 15px; }
  input[type="text"] {
    width: 100%; border: 0; border-radius: 14px;
    padding: 12px 14px; font-size: 16px;
    background: rgba(255,255,255,.1); color: white;
  }
  input::placeholder { color: rgba(255,255,255,.45); }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 22px;
    background: linear-gradient(180deg, #ffe7f2, #ffc2dc);
    color: #4a2340; font-size: 16px; font-weight: 700;
    min-height: 48px; cursor: pointer;
  }
  .btn.ghost { background: rgba(255,255,255,.12); color: white; }
  #btn-sfx, #btn-skip-song {
    position: fixed; z-index: 20; right: 12px;
    border: 0; border-radius: 999px; padding: 8px 12px; color: white;
    background: rgba(8,10,24,.5); font-size: 13px;
  }
  #btn-sfx { top: calc(10px + env(safe-area-inset-top)); }
  #btn-skip-song { top: calc(50px + env(safe-area-inset-top)); }
  #level-tag {
    position: fixed; z-index: 6; left: 14px; top: calc(12px + env(safe-area-inset-top));
    font-family: var(--round); font-size: 15px; letter-spacing: .06em;
    text-shadow: none;
  }
  #toast {
    position: fixed; z-index: 30; left: 50%; top: 18%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(20, 12, 28, .88); color: white;
    padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease-out), transform .25s var(--ease-out);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #praise {
    position: fixed; z-index: 7; left: 12px; bottom: 124px;
    max-width: 16em; background: rgba(255,255,255,.94); color: #3c2438;
    border-radius: 16px 16px 16px 4px; padding: 8px 12px; font-size: 14px; line-height: 1.45;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .35s var(--ease-out), transform .35s var(--ease-out);
  }
  #praise.show { opacity: 1; transform: none; }
  .prelude-line {
    font-family: var(--round);
    font-size: clamp(32px, 8vw, 54px);
    min-height: 1.3em;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-shadow: none;
    background: none;
    transition: transform .7s var(--ease-out);
  }
  .prelude-line .k-line { display: block; overflow: visible; background: none; text-shadow: none; }
  .prelude-line.to-corner { transform: translate(-34vw, -38vh) scale(.38); }
  .k-line { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .k-line > span {
    display: inline-block;
    animation: rise .62s var(--ease-out) both;
  }
  #btn-ready { margin-top: 22px; }
  #play-field {
    position: relative; width: min(560px, 100%); height: min(52vh, 440px);
    margin-top: 10px; touch-action: none;
  }
  .pad {
    position: absolute; bottom: 8px; width: 64px; height: 64px; border: 0; border-radius: 18px;
    background: rgba(255,255,255,.14); color: white; font-size: 28px;
  }
  #pad-left { left: 8px; }
  #pad-right { right: 8px; }
  .heart { position: absolute; width: 30px; height: 28px; margin: -14px 0 0 -15px; filter: drop-shadow(0 0 6px rgba(255, 70, 110, .85)); }
  .heart svg { width: 100%; height: 100%; display: block; }
  #score { font-family: var(--round); font-size: 28px; margin-top: 8px; }
  .q-opt {
    display: block; width: 100%; margin: 8px 0; min-height: 48px;
    border: 0; border-radius: 14px; background: rgba(255,255,255,.1); color: white; font-size: 16px;
  }
  .q-opt.on { background: #ffe7f2; color: #4a2340; font-weight: 700; }
  #q-card { position: relative; }
  #q-card h2 { font-size: 20px; margin-bottom: 8px; }
  #q-card.yes { animation: cardYes .78s cubic-bezier(.2,.85,.2,1); }
  #q-card.yes .q-opt.on { animation: optYes .78s ease-out; }
  .q-pop {
    position: absolute; left: 50%; top: 16px; width: 16px; height: 15px;
    margin: 0 0 0 -8px; pointer-events: none; z-index: 3;
    animation: qPop .8s ease-out forwards;
  }
  .q-pop svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 4px rgba(255,179,208,.9)); }
  .party { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #reveal-stack {
    position: relative; z-index: 2;
    animation: cuteSway 2.8s ease-in-out infinite, pinkGlow 1.8s ease-in-out infinite;
  }
  .reveal-name, .reveal-wish {
    font-family: "STHupo", "华文琥珀", "ST HuPo", serif;
    font-weight: 400;
    font-size: clamp(40px, 10vw, 68px);
    line-height: 1.25;
    color: #ffb3d0;
    -webkit-text-stroke: 2px #e01670;
    paint-order: stroke fill;
    letter-spacing: 0.03em;
  }
  .reveal-wish { margin-top: 6px; }
  .balloon {
    position: absolute; bottom: -30%; width: 36px; height: 46px;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    animation: riseBall 8s ease-in infinite;
  }
  .balloon::after {
    content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 48px;
    background: rgba(255,255,255,.55);
  }
  .ribbon { position: absolute; top: -14%; width: 9px; height: 18px; border-radius: 2px; animation: ribbonFall 2.8s linear forwards; }
  .bit { position: absolute; left: 50%; top: 42%; width: 7px; height: 7px; border-radius: 50%; animation: bitOut 1.5s var(--ease-out) forwards; }
  #cake-stage, #cake-box { position: relative; width: min(92vw, 520px); height: min(92vw, 620px); margin-top: 8px; touch-action: none; }
  #cake-box.split {
    position: fixed; z-index: 3; left: 50%; top: 44%; margin: 0;
    width: min(84vw, 460px); height: min(78vw, 520px);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #scene-cut #cake-box {
    position: fixed; z-index: 3; left: 50%; top: 50%; margin: 0;
    width: min(84vw, 460px); height: min(72vh, 520px);
    transform: translate(-50%, -50%);
    transition: transform 2.6s cubic-bezier(.22,.7,.2,1), width 2.6s cubic-bezier(.22,.7,.2,1), height 2.6s cubic-bezier(.22,.7,.2,1);
  }
  #scene-cut #cake-box.down {
    width: min(42vw, 220px); height: min(36vh, 250px);
    transform: translate(-50%, calc(50vh - 100% - 10px));
    pointer-events: none;
  }
  #scene-cut #cake-stage { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; }
  .reduce #scene-cut #cake-box { transition-duration: .2s; }
  .pop-star {
    position: fixed; z-index: 7; width: 26px; height: 26px; pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(255, 214, 120, .95));
  }
  .pop-star svg { width: 100%; height: 100%; display: block; }
  #cake-view { width: 100%; height: 100%; display: block; }
  #cake-cut { display: none; }
  #candle-grid { position: absolute; inset: 0; }
  #candle-grid.off { visibility: hidden; pointer-events: none; }
  .candle {
    position: absolute; width: 16px; height: 16px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; transform: translate(-50%, -50%);
  }
  .wish { font-family: var(--round); font-size: 18px; line-height: 1.6; text-align: center; max-width: 18em; margin: 8px 0; }
  .timer-row { display: flex; justify-content: space-between; width: min(92vw, 520px); font-variant-numeric: tabular-nums; }
  .timer-bar { width: min(92vw, 520px); height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; margin: 6px 0 4px; }
  .timer-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffe08a, #ff8fb8); transform-origin: left center; }
  #blow-zone {
    width: 116px; height: 116px; margin-top: 8px; border: 0; background: transparent; padding: 0;
  }
  #blow-zone svg { width: 100%; height: 100%; }
  #blow-ring { fill: none; stroke: #fff6d8; stroke-width: 4; stroke-dasharray: 214; stroke-dashoffset: 214; transform-origin: 50% 50%; transform: rotate(-90deg); }
  #blow-zone.hot #blow-ring { animation: drain 3s linear forwards; }
  #wind { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
  .gust, .mote { position: absolute; left: var(--x); bottom: -42%; pointer-events: none; }
  .gust {
    width: var(--w); height: var(--h); border-radius: 999px;
    background: linear-gradient(to top, transparent 0%, rgba(255,255,255,.45) 24%, rgba(236,248,255,.96) 50%, rgba(255,255,255,.45) 74%, transparent 100%);
    filter: blur(var(--blur)); opacity: 0; transform-origin: 50% 100%;
    animation: gustUp var(--dur) ease-in forwards; animation-delay: var(--d);
  }
  .gust.soft {
    background: linear-gradient(to top, rgba(255,255,255,0) 0%, rgba(198,228,255,.62) 38%, rgba(255,255,255,.2) 68%, transparent 100%);
  }
  .gust.sheet {
    left: -10%; width: 120%; height: 52vh; bottom: -18%; border-radius: 0;
    background: linear-gradient(to top, rgba(255,255,255,0) 0%, rgba(190,225,255,.5) 42%, rgba(255,255,255,.12) 72%, transparent 100%);
    filter: blur(12px);
  }
  .mote {
    bottom: -10px; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px #fff, 0 0 18px rgba(190,225,255,.9);
    animation: moteUp var(--dur) linear forwards; animation-delay: var(--d);
  }
  @keyframes gustUp {
    0% { transform: translate3d(0, 10vh, 0) scaleY(.4) skewX(var(--skew)); opacity: 0; }
    16% { opacity: var(--op); }
    100% { transform: translate3d(var(--dx), -128vh, 0) scaleY(1.25) skewX(var(--skew)); opacity: 0; }
  }
  @keyframes moteUp {
    0% { opacity: 0; transform: translate3d(0, 0, 0); }
    12% { opacity: .95; }
    100% { opacity: 0; transform: translate3d(var(--dx), -112vh, 0); }
  }
  #knife {
    position: absolute; left: 50%; top: 6px; width: 14px; height: 72px; margin-left: -7px;
    background: linear-gradient(#f7fbff, #d5deea); border-radius: 2px 2px 4px 4px;
    box-shadow: 0 6px 12px rgba(0,0,0,.35);
  }
  #knife::before {
    content: ""; position: absolute; left: -6px; top: -16px; width: 26px; height: 18px; border-radius: 4px;
    background: #c9843a;
  }
  #heart-wall { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  #mem-scroll {
    position: fixed; z-index: 70; left: 0; right: 0; top: 16%;
    height: min(48vh, 400px); overflow: hidden; pointer-events: none;
  }
  #mem-track { display: flex; gap: 14px; width: max-content; align-items: center; height: 100%; }
  #mem-track.roll { animation: memRoll linear forwards; }
  .mem-card {
    flex: none; height: 100%; width: auto; background: #fff; padding: 6px 6px 16px;
    box-shadow: 0 12px 24px rgba(0,0,0,.35);
  }
  .mem-card img { height: calc(100% - 8px); width: auto; max-width: min(70vw, 320px); object-fit: contain; display: block; background: #f6f3ee; }
  @keyframes memRoll { from { transform: translateX(100vw); } to { transform: translateX(calc(-100% - 8vw)); } }
  .m-item {
    position: fixed; padding: 4px 4px 12px; background: #fff; color: #222;
    box-shadow: 0 10px 18px rgba(0,0,0,.35);
    transform: translate(-50%, -50%) rotate(var(--rot));
    transition: left .7s var(--ease-out), top .7s var(--ease-out), width .7s var(--ease-out), height .7s var(--ease-out), transform .7s var(--ease-out), opacity .4s var(--ease-out);
    opacity: 0;
  }
  .m-item.show { opacity: 1; }
  .m-item img { width: 100%; height: calc(100% - 8px); object-fit: contain; display: block; background: #f6f3ee; }
  .m-item.pick {
    z-index: 36;
    box-shadow: 0 0 0 3px #fff6c8, 0 0 0 7px #e01670, 0 0 22px 6px rgba(255, 176, 214, .95);
  }
  .m-item.parade {
    z-index: 80 !important;
    transform: translate(-50%, -50%) rotate(0deg) !important;
  }
  .m-item.out {
    z-index: 80;
    transform: translate(-50%, -50%) rotate(0deg);
    box-shadow: 0 0 0 3px #fff6c8, 0 0 0 7px #e01670, 0 0 22px 6px rgba(255, 176, 214, .95);
  }
  #cap {
    position: fixed; z-index: 90; left: 50%; top: 68%; bottom: auto; transform: translateX(-50%);
    width: min(520px, calc(100% - 32px));
    background: rgba(255, 214, 230, .94); color: #7a2048;
    border: 1px solid rgba(224, 22, 112, .35);
    box-shadow: 0 8px 22px rgba(224, 22, 112, .28);
    border-radius: 16px; padding: 10px 12px;
    font-size: 14px; line-height: 1.65; text-align: center;
    transition: opacity .9s ease;
  }
  #cap.fade { opacity: 0; }
  #song-lyric, #lyric-zh {
    position: fixed; z-index: 90; left: 50%; top: calc(40px + env(safe-area-inset-top));
    transform: translateX(-50%); width: min(720px, calc(100% - 28px));
    text-align: center; font-size: 15px; line-height: 1.45; color: #fff8e8;
    text-shadow: 0 2px 10px #000;
  }
  #lyric-zh { position: static; transform: none; width: auto; margin-top: 18px; }
  .ly-en, .ly-zh { display: block; }
  .ly-zh { margin-top: 2px; font-size: 13px; color: #ffe6bf; }
  .ly-pop .ly-en, .ly-pop .ly-zh { animation: lyIn .42s var(--ease-out) both; }
  .ly-pop .ly-zh { animation-delay: .05s; }
  @keyframes lyIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .big { font-family: var(--round); font-size: clamp(26px, 6vw, 40px); text-align: center; text-shadow: 0 0 16px rgba(255,220,170,.7); }
  #scene-ending .scene-inner { padding-top: 148px; }
  #film {
    position: fixed; z-index: 6; top: 0; left: 0; right: 0;
    height: 124px; display: flex; flex-direction: column;
    pointer-events: none;
  }
  .film-holes { flex: none; height: 14px;
    background: radial-gradient(circle at 9px 7px, transparent 3.1px, #1c1610 3.5px) left center / 18px 14px repeat-x;
  }
  .film-window { flex: 1; background: #1c1610; overflow: hidden; }
  #film-track {
    display: flex; align-items: center; height: 100%; width: max-content;
    animation: filmLeft 70s linear infinite;
  }
  .film-frame {
    flex: none; width: 72px; height: 84px; margin: 0 5px;
    background: #0e0c0a; padding: 3px;
    box-shadow: 0 0 0 1px rgba(255, 214, 150, .28);
  }
  .film-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes filmLeft { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
  .letter { width: min(460px, 100%); }
  .letter-card {
    position: relative; width: 100%;
    animation: letterDissolve 4.6s ease both;
  }
  .letter-card img {
    width: 100%; height: auto; display: block;
    -webkit-mask-image:
      linear-gradient(to right, transparent, #000 4.5%, #000 95.5%, transparent),
      linear-gradient(to bottom, transparent, #000 8%, #000 97%, transparent);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent, #000 4.5%, #000 95.5%, transparent),
      linear-gradient(to bottom, transparent, #000 8%, #000 97%, transparent);
    mask-composite: intersect;
  }
  .letter-card .dear {
    position: absolute; left: 3.5%; top: 1.6%; margin: 0;
    font-family: "STXingkai", "华文行楷", "KaiTi", serif;
    font-size: clamp(26px, 5.4vw, 36px); line-height: 1; font-weight: 400;
    color: #b7dcff; letter-spacing: 0.08em;
    text-shadow: 0 0 12px rgba(150, 200, 255, .55);
  }
  @keyframes letterDissolve {
    0% { opacity: 0; filter: blur(16px); }
    100% { opacity: 1; filter: blur(0); }
  }
  .ending-line {
    font-size: clamp(24px, 5.4vw, 30px); font-weight: 800; color: #ffe08a;
    max-width: 16em; margin-top: 16px; line-height: 1.45;
  }
  .sign { opacity: .85; margin-top: 12px; }
  .catch-flash {
    position: fixed; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #fff; pointer-events: none; z-index: 6;
    animation: bitOut .5s var(--ease-out) forwards;
  }
  @keyframes kittenBreathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(0.984, 1.03); }
  }
  @keyframes kittenLook {
    0%, 58%, 100% { transform: rotate(0deg); }
    68%, 84% { transform: rotate(-2.8deg); }
  }
  @keyframes kittenLookHim {
    0%, 64%, 100% { transform: rotate(0deg); }
    74%, 90% { transform: rotate(2.4deg); }
  }
  @keyframes kittenTrot {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    16% { transform: translateY(3px) scale(1.06, 0.9); }
    40% { transform: translateY(-8px) scale(0.97, 1.05); }
    62% { transform: translateY(2px) scale(1.05, 0.92); }
    80% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes kittenSit {
    0% { transform: translateY(2px) scale(1.05, 0.92); }
    46% { transform: translateY(-2px) scale(0.985, 1.025); }
    100% { transform: none; }
  }

let skyImgs = [], stars = [], skyRunning = false, skyStart = 0, skyHiddenAt = 0, skyHiddenTotal = 0;
function resizeSky() {

function buildStars() {
  const rng = mulberry32(20261107);
  const c = $("sky");
  const n = Math.min(9000, Math.round((c.width * c.height) / 1400));
  stars = [];
  for (let i = 0; i < n; i++) {
    stars.push({
      x: rng(), y: rng(), z: rng(),
      r: rng() < 0.92 ? 1 : 2.2,

function coverDraw(ctx, img, w, h, pan) {
  const srcW = img.naturalWidth;
  const srcH = img.naturalHeight * 0.64;
  const scale = Math.max(w / srcW, h / srcH);
  const dw = srcW * scale;
  const dh = srcH * scale;
  const x = (w - dw) / 2 - pan;
  const y = (h - dh) / 2;
  ctx.drawImage(img, 0, 0, srcW, srcH, x, y, dw, dh);
}
function skyFrame(ts) {
  if (!skyRunning) return;
  const c = $("sky");
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height;
  if (skyStart === 0) skyStart = ts;
  if (document.hidden) {
    if (!skyHiddenAt) skyHiddenAt = ts;
    requestAnimationFrame(skyFrame);
    return;
  }
  if (skyHiddenAt) { skyHiddenTotal += ts - skyHiddenAt; skyHiddenAt = 0; }
  const t = reduce ? 0 : (ts - skyStart - skyHiddenTotal) / 1000;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#070b18");
  g.addColorStop(0.55, "#12182e");
  g.addColorStop(1, "#1a140c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  const ready = skyImgs.filter((im) => im.complete && im.naturalWidth);
  if (ready.length) {
    const span = 16;
    const idx = Math.floor(t / span) % ready.length;
    const nxt = (idx + 1) % ready.length;
    const u = (t % span) / span;
    const fade = u > 0.8 ? (u - 0.8) / 0.2 : 0;
    const shift = u * w * 0.06;
    [idx, nxt].forEach((k, pass) => {
      const alpha = pass === 0 ? 1 - fade : fade;
      if (alpha <= 0) return;
      ctx.globalAlpha = alpha;
      coverDraw(ctx, ready[k], w, h, shift + pass * 12);
    });
  }
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = "#10182f";
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "lighter";
  const neb = ctx.createRadialGradient(w * 0.62, h * 0.42, 10, w * 0.58, h * 0.4, w * 0.38);
  neb.addColorStop(0, "rgba(120, 90, 180, .16)");
  neb.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = neb;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  stars.forEach((s) => {
    const speed = 0.008 + s.z * 0.012;
    const x = ((s.x - t * speed) % 1 + 1) % 1;
    const y = ((s.y + Math.sin(t * 0.05 + s.ph) * 0.004) % 1 + 1) % 1;
    const tw = reduce ? 1 : 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * (0.8 + s.z) + s.ph));
    const px = Math.round(x * w);
    const py = Math.round(y * h);
    ctx.globalAlpha = (0.45 + s.z * 0.55) * tw;
    ctx.fillStyle = s.z > 0.93 ? "#fff4d2" : "#f7f9ff";
    ctx.fillRect(px, py, s.r, s.r);
    if (s.spike) {
      ctx.globalAlpha *= 0.8;
      ctx.fillRect(px - 5, py, 11, 1);
      ctx.fillRect(px, py - 5, 1, 11);
    }
  });
  ctx.globalAlpha = 1;
  const air = ctx.createLinearGradient(0, h * 0.9, 0, h);
  air.addColorStop(0, "rgba(0,0,0,0)");
  air.addColorStop(1, "rgba(90, 70, 40, .28)");
  ctx.fillStyle = air;
  ctx.fillRect(0, h * 0.9, w, h * 0.1);
  const vig = ctx.createRadialGradient(w / 2, h * 0.42, w * 0.2, w / 2, h * 0.45, w * 0.78);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,.28)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);
  requestAnimationFrame(skyFrame);
}

    if (e.target.closest(".pad")) return;
    putCat(e.clientX, e.clientY);
    try { stageLv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stageLv.addEventListener("pointermove", (e) => {
    if (!grabbing || state.scene !== "level1" || levelWon) return;
    putCat(e.clientX, e.clientY);
  });
  const releaseCat = () => { grabbing = false; steerOn = false; };
  stageLv.addEventListener("pointerup", releaseCat);
  stageLv.addEventListener("pointercancel", releaseCat);
  function bindPad(id, dir) {
    const btn = $(id);
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      holdDir = dir;
      steerOn = true;
      grabbing = false;
      sfx.unlock();
      sfx.tap();
    });
    const up = () => { if (holdDir === dir) { holdDir = 0; if (!grabbing) steerOn = false; } };
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
  }
  bindPad("pad-left", -1); bindPad("pad-right", 1);
  window.addEventListener("keydown", (e) => {
    if (state.scene !== "level1") return;
    if (e.key === "ArrowLeft") { holdDir = -1; steerOn = true; }
    if (e.key === "ArrowRight") { holdDir = 1; steerOn = true; }
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { holdDir = 0; if (!grabbing) steerOn = false; }
  });
  $("btn-continue").addEventListener("click", () => { sfx.unlock(); sfx.tap(); afterReveal(); });
  const blow = $("blow-zone");
  blow.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (candlePhase !== "blow") return;
    sfx.unlock();
    try { blow.setPointerCapture(e.pointerId); } catch (err) {}
    blow.classList.add("hot");
    $("pet-him").classList.add("blowing");
    clearTimeout(blowTimer);
    blowTimer = setTimeout(blowOut, reduce ? 400 : 3000);
  });
  const cancelBlow = () => {
    if (candlePhase !== "blow") return;
    clearTimeout(blowTimer);
    blow.classList.remove("hot");
    $("pet-him").classList.remove("blowing");
  };
  blow.addEventListener("pointerup", cancelBlow);
  blow.addEventListener("pointercancel", cancelBlow);
  $("btn-skip-song").addEventListener("click", () => {
    sfx.tap();
    if (bdayAudio) { try { bdayAudio.pause(); } catch (e) {} }
    showBlow();
  });
  const box = $("cake-box");
  box.addEventListener("pointerdown", (e) => {
    if (state.scene !== "cut" || !cutReady || cutDone) return;
    cutY = e.clientY;
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  });
  box.addEventListener("pointermove", (e) => {
    if (cutY == null) return;
    const dy = Math.max(0, e.clientY - cutY);
    $("knife").style.top = (6 + dy) + "px";
    if (dy > box.clientHeight * 0.42) finishCut();
  });
  box.addEventListener("pointerup", () => { cutY = null; });
  box.addEventListener("pointercancel", () => { cutY = null; });
  $("scene-cut").addEventListener("click", () => { if (storyKick && $("heart-wall") && !$("heart-wall").hidden) storyKick(); });
  $("to-ending").addEventListener("click", () => {
    const btn = $("to-ending");
    if (btn.disabled) return;
    btn.disabled = true;
    sfx.unlock();
    sfx.tap();
    const cap = $("cap");
    cap.classList.add("fade");
    setTimeout(() => {
      cap.hidden = true;
      cap.classList.remove("fade");
      $("heart-wall").hidden = true;
      btn.disabled = false;
      go("ending");
    }, reduce ? 200 : 900);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (sfx.ctx && sfx.ctx.state === "running") sfx.ctx.suspend();
      if (ido && !ido.paused) { ido.pause(); ido._resume = musicPhase === "ido"; }
      if (finalAudio && !finalAudio.paused) { finalAudio.pause(); finalAudio._resume = true; }
      if (bdayAudio && !bdayAudio.paused) { bdayAudio.pause(); bdayAudio._resume = true; }
    } else {
      if (sfx.ctx && sfx.ctx.state === "suspended") sfx.ctx.resume();
      if (ido && ido._resume) { ido._resume = false; ido.play().catch(() => {}); }
      if (finalAudio && finalAudio._resume) { finalAudio._resume = false; finalAudio.play().catch(() => {}); }
      if (bdayAudio && bdayAudio._resume) { bdayAudio._resume = false; bdayAudio.play().catch(() => {}); }
    }
  });
  let logged = false;
  try { logged = sessionStorage.getItem("bd-in") === "1"; } catch (e) {}
  const jump = new URLSearchParams(location.search).get("scene");
  if (jump && $("scene-" + jump)) {
    $("pets").hidden = false;
    layoutPets("dock", false);
    if (jump !== "login") {
      if (jump !== "prelude") startIdo();
      go(jump);
    }
  } else if (logged) {
    startIdo();
    beginIntro();
  }
}
boot();
</script>
</body>
</html>
